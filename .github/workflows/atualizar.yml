name: Atualizar catalogo

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Filtrar o XML da loja
        run: python filtrar.py
      - name: Salvar o resultado
        run: |
          git config user.name "robo-catalogo"
          git config user.email "robo-catalogo@users.noreply.github.com"
          git add feed.xml relatorio.txt
          git diff --cached --quiet || git commit -m "Atualiza catalogo"
          git push
